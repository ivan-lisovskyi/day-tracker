<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app draw under the notch; safe areas are handled in CSS. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1115">

  <!-- iOS standalone (home screen) mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мой день">
  <meta name="format-detection" content="telephone=no">

  <title>Мой день</title>
  <meta name="description" content="Трекер распорядка дня и привычек. Работает офлайн.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 id="screen-title" class="app-header__title">Сегодня</h1>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Разделы">
    <a class="tabbar__item" href="#today" data-route="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></svg>
      <span>Сегодня</span>
    </a>
    <a class="tabbar__item" href="#week" data-route="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V12M9.7 19V8M14.3 19v-5M19 19V5"/></svg>
      <span>Неделя</span>
    </a>
    <a class="tabbar__item" href="#settings" data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Настройки</span>
    </a>
  </nav>
</body>
</html>
